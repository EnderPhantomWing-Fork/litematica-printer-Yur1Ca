name: release-version-set

on:
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: Existing or new GitHub release tag
        type: string
        required: true
      version_set:
        description: Version set to release
        type: choice
        required: true
        default: lts
        options:
          - lts
          - archive
          - all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        shell: bash
        env:
          VERSION_SET: ${{ inputs.version_set }}
        run: |
          resolve_java() {
            case "$1" in
              26.*) echo "25" ;;
              1.20.6|1.21.*) echo "21" ;;
              *) echo "17" ;;
            esac
          }

          if [ "$VERSION_SET" = "archive" ]; then
            versions=("1.21.3" "1.21.1" "1.20.6" "1.20.4" "1.20.2" "1.20.1" "1.19.4" "1.18.2")
          elif [ "$VERSION_SET" = "all" ]; then
            versions=("26.1" "1.21.11" "1.21.9" "1.21.6" "1.21.5" "1.21.4" "1.21.3" "1.21.1" "1.20.6" "1.20.4" "1.20.2" "1.20.1" "1.19.4" "1.18.2")
          else
            versions=("26.1" "1.21.11" "1.21.9" "1.21.6" "1.21.5" "1.21.4")
          fi

          json="["
          separator=""
          for version in "${versions[@]}"; do
            java="$(resolve_java "$version")"
            json="${json}${separator}{\"version\":\"${version}\",\"java\":\"${java}\"}"
            separator=","
          done
          json="${json}]"
          echo "targets=${json}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java ${{ matrix.target.java }}
        id: setup_java
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.target.java }}
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./libs
          key: ${{ runner.os }}-gradle-${{ matrix.target.version }}-java-${{ matrix.target.java }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties', 'buildSrc/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.target.version }}-java-${{ matrix.target.java }}-
            ${{ runner.os }}-gradle-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ matrix.target.version }}
        run: ./gradlew :${{ matrix.target.version }}:build --stacktrace -Dorg.gradle.java.installations.auto-detect=true -Dorg.gradle.java.installations.paths="${{ steps.setup_java.outputs.path }}"
        env:
          IS_THIS_RELEASE: true
          TARGET_MC_VERSIONS: ${{ matrix.target.version }}

      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target.version }}
          path: versions/${{ matrix.target.version }}/build/libs/*.jar
          retention-days: 7

  build_wrapper:
    if: ${{ inputs.version_set == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 17
        id: setup_java_17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Java 21
        id: setup_java_21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Java 25
        id: setup_java_25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./libs
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties', 'buildSrc/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-
            ${{ runner.os }}-gradle-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all versions wrapper
        run: ./gradlew :fabricWrapper:build --stacktrace -Dorg.gradle.java.installations.auto-detect=true -Dorg.gradle.java.installations.paths="${{ steps.setup_java_17.outputs.path }},${{ steps.setup_java_21.outputs.path }},${{ steps.setup_java_25.outputs.path }}"
        env:
          IS_THIS_RELEASE: true

      - name: Delete wrapper sources jar
        run: |
          find fabricWrapper/build/libs/ -name "*-sources.jar" -delete

      - name: Capture wrapper artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-all-wrapper
          path: |
            fabricWrapper/build/libs/*.jar
            fabricWrapper/build/libs/jars/*.jar
          retention-days: 7

  publish:
    needs:
      - build
      - build_wrapper
    if: ${{ always() && needs.build.result == 'success' && (needs.build_wrapper.result == 'success' || needs.build_wrapper.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Upload jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_release_tag }}
          files: release-artifacts/**/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
