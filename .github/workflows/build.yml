name: build

on:
  push:
    paths-ignore: ['*.md']
  pull_request:
  workflow_dispatch:
    inputs:
      build_wrapper:
        description: Build all-version wrapper artifacts
        type: boolean
        required: false
        default: false

env:
  IS_THIS_RELEASE: false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build-26.1
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.build_wrapper }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 25
        id: setup_java_25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./libs
          key: ${{ runner.os }}-gradle-26.1-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties', 'buildSrc/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-26.1-
            ${{ runner.os }}-gradle-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build 26.1
        run: ./gradlew :26.1:build --stacktrace -Dorg.gradle.java.installations.auto-detect=true -Dorg.gradle.java.installations.paths="${{ steps.setup_java_25.outputs.path }}"
        env:
          TARGET_MC_VERSIONS: 26.1

      - name: Capture 26.1 artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-26.1
          path: versions/26.1/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  build_wrapper:
    name: build-wrapper
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_wrapper }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 17
        id: setup_java_17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Java 21
        id: setup_java_21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Java 25
        id: setup_java_25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./libs
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts', '**/gradle.properties', 'buildSrc/**') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-
            ${{ runner.os }}-gradle-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build all versions wrapper
        run: ./gradlew :fabricWrapper:build --stacktrace -Dorg.gradle.java.installations.auto-detect=true -Dorg.gradle.java.installations.paths="${{ steps.setup_java_17.outputs.path }},${{ steps.setup_java_21.outputs.path }},${{ steps.setup_java_25.outputs.path }}"

      - name: Delete wrapper sources jar
        run: |
          find fabricWrapper/build/libs/ -name "*-sources.jar" -delete

      - name: Capture versionpack artifact
        uses: actions/upload-artifact@v7
        with:
          name: versionpack
          path: fabricWrapper/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

      - name: Capture standalone version jars
        uses: actions/upload-artifact@v7
        with:
          name: version-jars
          path: fabricWrapper/build/libs/jars/*.jar
          if-no-files-found: error
          retention-days: 1
