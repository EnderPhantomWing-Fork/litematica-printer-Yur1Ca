name: release-version-or-wrapper

on:
  workflow_dispatch:
    inputs:
      target_release_tag:
        description: Existing or new GitHub release tag
        type: string
        required: true
      target_version:
        description: Minecraft version to release, or all for wrapper jar
        type: choice
        required: true
        default: 26.1
        options:
          - all
          - 26.1
          - 1.21.11
          - 1.21.9
          - 1.21.6
          - 1.21.5
          - 1.21.4
          - 1.21.3
          - 1.21.1
          - 1.20.6
          - 1.20.4
          - 1.20.2
          - 1.20.1
          - 1.19.4
          - 1.18.2

env:
  IS_THIS_RELEASE: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Java 17
        id: setup_java_17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Java 21
        id: setup_java_21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Java 25
        id: setup_java_25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ./.gradle
            ./libs
          key: ${{ runner.os }}-gradle-${{ inputs.target_version }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build ${{ inputs.target_version }}
        if: ${{ inputs.target_version != 'all' }}
        run: ./gradlew :${{ inputs.target_version }}:build --stacktrace -Dorg.gradle.java.installations.auto-detect=true -Dorg.gradle.java.installations.paths="${{ steps.setup_java_17.outputs.path }},${{ steps.setup_java_21.outputs.path }},${{ steps.setup_java_25.outputs.path }}"
        env:
          TARGET_MC_VERSIONS: ${{ inputs.target_version }}

      - name: Build all versions wrapper
        if: ${{ inputs.target_version == 'all' }}
        run: ./gradlew :fabricWrapper:build --stacktrace -Dorg.gradle.java.installations.auto-detect=true -Dorg.gradle.java.installations.paths="${{ steps.setup_java_17.outputs.path }},${{ steps.setup_java_21.outputs.path }},${{ steps.setup_java_25.outputs.path }}"

      - name: Delete wrapper sources jar
        if: ${{ inputs.target_version == 'all' }}
        run: |
          find fabricWrapper/build/libs/ -name "*-sources.jar" -delete

      - name: Upload single-version jars to GitHub Release
        if: ${{ inputs.target_version != 'all' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_release_tag }}
          files: versions/${{ inputs.target_version }}/build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload wrapper jar to GitHub Release
        if: ${{ inputs.target_version == 'all' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.target_release_tag }}
          files: |
            fabricWrapper/build/libs/*.jar
            fabricWrapper/build/libs/jars/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
